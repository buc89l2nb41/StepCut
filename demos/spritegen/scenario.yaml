# 참고 영상을 올려 적용한 뒤, 화면이 8칸 결과로 바뀌게 한다. 유료 생성은 없다.
# 참고 파일은 0.77초라 화면에서 3초로 늘어 적용된다.
project: SpriteGen
driver: web
app:
  url: http://localhost:5174/
  ready: http://localhost:5174/api/status
  start:
    cmd: npm run dev
    cwd: D:/Cursor/SpriteGen
    timeout: 60
window:
  title: SpriteGen
  fullscreen: true
  scale: 1.25
record:
  scene: StepCut
retries: 2
edit:
  wait: speed
  speed: 8
  keep: 0.4
  auto_wait: 2.0
  lead_in: 0.6
  tail: 1.2
  min_caption: 1.8

steps:
  - id: open
    do: goto
    caption: SpriteGen은 그림 한 장으로 같은 캐릭터의 스프라이트 8장을 만듭니다.
    expect: {text: 기준 그림}
    hold: 3.4

  - id: explain-character
    do: pause
    caption: 캐릭터에 올린 기준 그림 한 장을 세 방식이 함께 씁니다.
    expect: {text: 세 방식 모두}
    hold: 2.4

  - id: upload-character
    feature: reference-character
    do: upload
    target: 'input[type="file"]'
    file: D:/Cursor/SpriteGen/.gen/character.png
    caption: 기준이 될 캐릭터 그림을 한 장 올립니다.
    expect: {images_loaded: 'img[alt="기준 캐릭터"]'}
    hold: 2.6

  - id: explain-text
    feature: text-method
    do: click
    target: {role: button, name: 문장참고, exact: true}
    caption: 문장참고는 동작을 문장으로 적으면 보낼 문장을 만들어 줍니다.
    expect: {visible: {label: 동작 설명}}
    hold: 2.6

  - id: type-name
    do: type
    target: {label: 동작 이름}
    text: 주먹
    expect: {value: {target: {label: 동작 이름}, equals: 주먹}}
    hold: 0.5

  - id: type-action
    do: type
    target: {label: 동작 설명}
    text: 주먹을 한 번 내지른다
    caption: 동작 이름과 설명을 적으면 이 문장이 생성에 쓰입니다.
    expect: {value: {target: {label: 동작 설명}, equals: 주먹을 한 번 내지른다}}
    hold: 2.2

  - id: show-prompt
    feature: text-method
    do: scroll
    target: {label: 보낼 문장}
    caption: 옆모습과 고정 카메라 같은 조건이 보낼 문장에 자동으로 붙습니다.
    expect: {js: "() => [...document.querySelectorAll('textarea')].some(t => t.value.includes('주먹을 한 번 내지른다'))"}
    hold: 3.0

  - id: explain-pose
    feature: pose-method
    do: click
    target: {role: button, name: 포즈참고, exact: true}
    caption: 포즈참고는 화면의 3D 몸에서 관절을 고쳐 동작을 정합니다.
    expect: {visible: canvas}
    hold: 2.4

  - id: pose-rotate
    do: click
    target: {role: button, name: 회전, exact: true}
    caption: 회전을 고르면 관절의 각도를 바꿀 수 있습니다.
    expect: {visible: canvas}
    hold: 1.8

  - id: explain-video
    feature: video-method
    do: click
    target: {role: button, name: 영상참고, exact: true}
    caption: 영상참고는 참고 영상의 동작을 같은 캐릭터가 따라 하게 합니다.
    expect: {text: 회색 인형 그림}
    hold: 2.6

  - id: type-video-name
    do: type
    target: {label: 동작 이름}
    text: 승룡권
    caption: 동작 이름을 승룡권으로 적습니다.
    expect: {value: {target: {label: 동작 이름}, equals: 승룡권}}
    hold: 1.8

  - id: upload-reference
    feature: video-method
    do: upload
    target: 'input[accept="video/mp4,video/webm"]'
    file: D:/Claude/StepCut/demos/spritegen/refs/l7JW1lQPFEyfcxBSlBo3tyQR8zzqD3TrkFfpS26pdQAi4ADmkn5xQ3RAzLn9xC2w3LnVEyQ8Pv4ag87v28GZ7g.mp4
    caption: 참고로 받은 승룡권 영상을 올립니다.
    expect: {text: 3초로 늘렸습니다}
    timeout: 45
    hold: 3.2

  - id: apply-reference
    do: click
    target: {role: button, name: /직접 올린 영상/}
    caption: 올린 영상을 이 캐릭터가 따라 할 참고로 적용합니다.
    expect: {visible: 'video.source-clip'}
    hold: 2.4

  - id: reveal-result
    feature: eight-frames
    do: click
    target: {role: button, name: /영상참고 · 승룡권/}
    caption: 적용한 동작이 같은 캐릭터의 8칸 스프라이트로 나옵니다.
    expect: {images_loaded: '.frame-pick img'}
    hold: 3.6

  - id: show-source-video
    feature: source-video
    do: click
    target: {role: button, name: 원본 영상 보기}
    caption: 칸을 뽑아 낸 원본 영상도 함께 볼 수 있습니다.
    expect: {visible: '.player video'}
    hold: 3.4
